# Wokwi headless simulation of examples/SimulatedSystem on Arduino Uno.
# Firmware built with:
#   arduino-cli compile --fqbn arduino:avr:uno --library . --build-path <dir> examples/SimulatedSystem/SimulatedSystem.ino
# Run (from this folder):
#   wokwi-cli --timeout 60000 --serial-log-file serial.log
[wokwi]
version = 1
firmware = 'SimulatedSystem.ino.hex'
elf = 'SimulatedSystem.ino.elf'
board = 'arduino-uno'
