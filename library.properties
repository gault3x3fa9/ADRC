paragraph=2nd-order LADRC with an Extended State Observer that estimates and cancels unknown dynamics and external disturbances. Tuning needs three values (b0, controller bandwidth, observer bandwidth) instead of three interdependent PID gains. Includes diagnostics getters, bumpless manual/auto switching and a no-hardware simulated example.
