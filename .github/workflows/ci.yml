name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          g++ -Wall -Wextra -I extras/test/stub -I src \
              extras/test/host_test.cpp src/ADRC.cpp -o host_test
          ./host_test

  robustness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run adversarial robustness tests
        run: |
          g++ -Wall -I extras/test/stub -I src \
              extras/test/robustness_test.cpp src/ADRC.cpp -o robustness_test
          ./robustness_test

  fuzz-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run deterministic fuzz tests
        run: |
          g++ -O2 -Wall -Wextra -std=gnu++11 -I extras/test/stub -I src \
              extras/test/fuzz_test.cpp src/ADRC.cpp -o fuzz_test
          ./fuzz_test

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "ADRC vs PID effectiveness benchmark (gate: ADRC must not regress)"
        run: |
          g++ -O2 -Wall -I extras/test/stub -I src \
              extras/test/benchmark.cpp src/ADRC.cpp -o benchmark
          ./benchmark

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: specification

  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: |
            - examples/SimulatedSystem
            - examples/BasicUsage
            - examples/ADRC1Heater
          libraries: |
            - source-path: ./
